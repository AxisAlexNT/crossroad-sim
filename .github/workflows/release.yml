# По тегу вида v1.2.3 собирает файл, проверяет его и прикладывает к выпуску на GitHub.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Полная регрессия перед выпуском
        run: npm test
      - run: npm run build
      - run: npm run check:dist
      - name: Имя файла с версией
        run: cp dist/index.html "crossroad-sim-${GITHUB_REF_NAME}.html"
      - name: Канал выпуска
        id: channel
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'prerelease=' + String(pkg.releaseChannel === 'intermediate') + '\n');
          NODE
      - uses: softprops/action-gh-release@v2
        with:
          files: crossroad-sim-${{ github.ref_name }}.html
          body_path: CHANGELOG.MD
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.channel.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          generate_release_notes: true
