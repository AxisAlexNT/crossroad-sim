# По тегу вида v1.2.3 собирает файл, проверяет его и прикладывает к выпуску на GitHub.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Полная регрессия перед выпуском
        run: npm test
      - run: npm run build
      - run: npm run check:dist
      - name: Имя файла с версией
        run: cp dist/index.html "crossroad-sim-${GITHUB_REF_NAME}.html"
      - uses: softprops/action-gh-release@v2
        with:
          files: crossroad-sim-${{ github.ref_name }}.html
          generate_release_notes: true
