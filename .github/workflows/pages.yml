# Публикация на GitHub Pages: страница открывается по ссылке в любом браузере, включая телефоны,
# где HTML-файл из мессенджера не запускается. В настройках репозитория: Pages → Source → GitHub Actions.
name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      preview:
        description: 'Предварительная публикация с известными ограничениями'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.preview && 'pages-preview' || 'pages' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Полная регрессия перед публикацией
        if: github.event_name != 'workflow_dispatch' || !inputs.preview
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: npm test
      - name: Проверки предварительной сборки
        if: github.event_name == 'workflow_dispatch' && inputs.preview
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: |
          node -e "const p=require('./package.json'); if(p.releaseChannel!=='preview'||!p.version.includes('-preview.'))process.exit(1)"
          npm run typecheck
          npm run test:language
          npm run test:privacy
          node --import tsx scripts/stopping-point.ts
          node --import tsx scripts/lookahead-stopping-room.ts
          node --import tsx scripts/remaining-reaction-gap.ts
          node --import tsx scripts/lane-change-occupancy.ts
          node --import tsx scripts/approach-front-position.ts
          node --import tsx scripts/exit-capacity-clock.ts
          node --import tsx scripts/exit-capacity-code.ts
      - run: npm run build
      - run: npm run check:dist
      - name: Проверка состава сборки
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: npm run test:privacy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
